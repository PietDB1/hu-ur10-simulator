services:
  # De robot-simulator (PolyScope), officieel image van Universal Robots
  ursim:
    image: universalrobots/ursim_cb3:3.15
    environment:
      - ROBOT_MODEL=UR10
    volumes:
      # Programma's (.urp) die je in PolyScope opslaat komen in de map 'programs'
      - ../programs:/ursim/programs
    restart: unless-stopped

  # De blokkenomgeving (webpagina op poort 8000) start automatisch mee
  blokken:
    image: mcr.microsoft.com/devcontainers/python:3.12
    network_mode: service:ursim
    volumes:
      - ..:/app
    working_dir: /app
    command: python3 -u blokken/server.py
    restart: unless-stopped
    depends_on:
      - ursim

  # De programmeeromgeving (VS Code + Python) deelt het netwerk met de simulator,
  # zodat de robot in je code gewoon op 127.0.0.1 staat.
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.12
    network_mode: service:ursim
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - ursim
