<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Blokken – HU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/blockly@11.2.2/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.2/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.2/python_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.2.2/msg/nl.js"></script>
<style>
  :root {
    --bg: #f4f4f2; --paneel: #ffffff; --tekst: #1d1d1b; --zacht: #6b6b66;
    --rand: #dcdcd6; --balk: #1d1d1b; --accent: #e3051b; --groen: #1f8a4c; --code: #f7f7f4;
    --arm: #4a6fa5; --pijl: #e3051b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tekst);
    font-family: "Public Sans", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--balk); color: #fff; padding: 10px 16px; }
  header h1 { font-family: Oswald, sans-serif; font-weight: 600; font-size: 20px;
    letter-spacing: .5px; margin: 0 12px 0 0; text-transform: uppercase; }
  header h1 span { color: var(--accent); }
  button, .knop { font: 600 14px "Public Sans", sans-serif; border: 0; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; text-decoration: none; color: #fff; background: #3b3b38; }
  button:hover, .knop:hover { filter: brightness(1.15); }
  #uitvoeren { background: var(--groen); font-size: 15px; padding: 8px 18px; }
  #stop { background: var(--accent); }
  .rechts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  body { display: flex; flex-direction: column; }
  main { display: flex; flex: 1; min-height: 0; }
  #werkblad { flex: 1; min-width: 0; }
  aside { width: 380px; display: flex; flex-direction: column; border-left: 1px solid var(--rand);
    background: var(--paneel); min-height: 0; }
  aside h2 { font-family: Oswald, sans-serif; font-weight: 500; font-size: 15px; text-transform: uppercase;
    letter-spacing: .5px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--rand); color: var(--zacht); }
  #uitleg { padding: 10px 14px 14px; border-bottom: 1px solid var(--rand); }
  #uitleg .plaat { background: #f9f9f7; border: 1px solid var(--rand); border-radius: 8px; height: 170px;
    display: flex; align-items: center; justify-content: center; }
  #uitleg .plaat svg { width: 100%; height: 100%; }
  #uitleg h3 { font: 600 15px "Public Sans", sans-serif; margin: 10px 0 4px; }
  #uitleg p { margin: 0; font-size: 14px; line-height: 1.45; color: #3a3a37; }
  pre { margin: 0; padding: 12px 14px; font: 13px/1.5 ui-monospace, Menlo, monospace; overflow: auto;
    white-space: pre-wrap; background: var(--code); }
  #uitleg .plaat { height: 130px; }
  aside { width: 420px; }
  .codekop { display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--rand); }
  .codekop h2 { border: 0; flex: 1; }
  .codekop button { font-size: 12px; padding: 5px 10px; }
  #toepassen { background: var(--groen); }
  #python { flex: 1; min-height: 120px; padding: 8px 0; cursor: default; }
  #python .regel { padding: 0 14px; min-height: 19.5px; border-left: 4px solid transparent; }
  #python .regel[data-id] { cursor: pointer; }
  #python .regel[data-id]:hover { background: #eef1f6; }
  #python .regel.actief { background: #fff3c4; border-left-color: #f2b705; }
  #python .nr { display: inline-block; width: 22px; color: #b0b0aa; user-select: none; }
  #editor { flex: 1; min-height: 120px; display: none; border: 0; outline: 0; resize: none; padding: 12px 14px;
    font: 13px/1.5 ui-monospace, Menlo, monospace; background: #fffdf3; color: var(--tekst); tab-size: 4; }
  aside.bewerken #python { display: none; }
  aside.bewerken #editor { display: block; }
  .alleenbewerken { display: none; }
  aside.bewerken .alleenbewerken { display: inline-block; }
  aside.bewerken .alleenbekijken { display: none; }
  select { font: 600 14px "Public Sans", sans-serif; border-radius: 6px; padding: 7px 8px; border: 0;
    background: #3b3b38; color: #fff; cursor: pointer; }
  #uitvoer { height: 90px; border-top: 1px solid var(--rand); background: #fff; }
  .ok { color: var(--groen); } .fout { color: var(--accent); }

  /* Overzicht van alle blokken */
  #overzicht { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 100;
    align-items: flex-start; justify-content: center; padding: 30px 16px; overflow: auto; }
  #overzicht.open { display: flex; }
  #overzicht .doos { background: #fff; border-radius: 12px; max-width: 1100px; width: 100%; padding: 20px 24px; }
  #overzicht .kop { display: flex; align-items: center; }
  #overzicht h2 { font-family: Oswald, sans-serif; text-transform: uppercase; margin: 0; font-size: 22px; }
  #overzicht .kop button { margin-left: auto; }
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
  .kaart { border: 1px solid var(--rand); border-radius: 10px; overflow: hidden; }
  .kaart .plaat { height: 140px; background: #f9f9f7; border-bottom: 1px solid var(--rand); }
  .kaart .plaat svg { width: 100%; height: 100%; }
  .kaart .tekst { padding: 10px 12px; }
  .kaart .blok { display: inline-block; color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 13px; font-weight: 600; }
  .kaart p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: #3a3a37; }

  @media (max-width: 800px) {
    main { flex-direction: column; height: auto; }
    #werkblad { height: 70vh; }
    aside { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Robot <span>blokken</span></h1>
  <button id="uitvoeren">▶ Uitvoeren</button>
  <button id="stop">■ Stop</button>
  <button id="aanzetten">⚡ Robot aan</button>
  <div class="rechts">
    <select id="voorbeelden" title="Laad een voorbeeldprogramma">
      <option value="">📂 Voorbeelden…</option>
      <option value="0">1. Eerste beweging</option>
      <option value="1">2. Vierkant tekenen</option>
      <option value="2">3. Pak en plaats</option>
      <option value="3">4. Toren bouwen (variabele)</option>
    </select>
    <button id="alleblokken">📖 Uitleg blokken</button>
    <a class="knop" id="robotlink" target="_blank">🤖 Robotscherm</a>
    <button id="download" title="Download als Python-bestand">⬇ .py</button>
    <button id="leeg" title="Werkblad leegmaken">🗑</button>
  </div>
</header>
<main>
  <div id="werkblad"></div>
  <aside>
    <h2>Wat doet dit blok?</h2>
    <div id="uitleg"></div>
    <div class="codekop">
      <h2>Python-code</h2>
      <button id="bewerk" class="alleenbekijken">✏ Code aanpassen</button>
      <button id="toepassen" class="alleenbewerken">✓ Zet om naar blokken</button>
      <button id="annuleer" class="alleenbewerken">✕ Annuleer</button>
    </div>
    <pre id="python"></pre>
    <textarea id="editor" spellcheck="false"></textarea>
    <h2>Berichten</h2>
    <pre id="uitvoer">Sleep blokken naar het werkblad en klik op ▶ Uitvoeren.</pre>
  </aside>
</main>
<div id="overzicht"><div class="doos">
  <div class="kop"><h2>Wat doen de blokken?</h2><button id="sluit">✕ Sluiten</button></div>
  <div class="raster" id="raster"></div>
</div></div>

<script>
// =====================================================================
// ILLUSTRATIES (getekend als SVG)
// =====================================================================
const ARM = "#4a6fa5", PIJL = "#e3051b", GRIJS = "#9a9a94", DONKER = "#1d1d1b";

function svg(inhoud, label) {
  return `<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans, sans-serif">
    <defs><marker id="pk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="${PIJL}"/></marker></defs>
    ${inhoud}
    ${label ? `<text x="232" y="16" text-anchor="end" font-size="11" fill="${GRIJS}">${label}</text>` : ""}
  </svg>`;
}
const pijl = (x1, y1, x2, y2) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${PIJL}" stroke-width="4" stroke-linecap="round" marker-end="url(#pk)"/>`;
const tekst = (x, y, t, kleur = PIJL, grootte = 13) =>
  `<text x="${x}" y="${y}" font-size="${grootte}" font-weight="600" fill="${kleur}" text-anchor="middle">${t}</text>`;

// Gripper getekend bij punt (x,y) dat de gripper naar beneden wijst. open = bek open
function gripper(x, y, open = true, kleur = DONKER) {
  const w = open ? 11 : 5;
  return `<rect x="${x - 13}" y="${y}" width="26" height="8" rx="2" fill="${kleur}"/>
    <rect x="${x - w - 3}" y="${y + 8}" width="4" height="16" fill="${kleur}"/>
    <rect x="${x + w - 1}" y="${y + 8}" width="4" height="16" fill="${kleur}"/>`;
}
// Zijaanzicht van de arm in startpositie; gripper bij (gx, gy)
function armZij(gx = 150, gy = 70, kleur = ARM, open = true) {
  return `<line x1="10" y1="146" x2="230" y2="146" stroke="${GRIJS}" stroke-width="2"/>
    <rect x="28" y="124" width="34" height="22" rx="3" fill="${DONKER}"/>
    <path d="M45,120 L45,42 L${gx},42 L${gx},${gy}" fill="none" stroke="${kleur}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="45" cy="120" r="9" fill="${kleur}"/><circle cx="45" cy="42" r="9" fill="${kleur}"/><circle cx="${gx}" cy="42" r="8" fill="${kleur}"/>
    ${gripper(gx, gy, open)}`;
}
// Bovenaanzicht: voet bij (60,80), gripper bij (gx,gy)
function armBoven(gx = 160, gy = 80, kleur = ARM) {
  return `<circle cx="60" cy="80" r="20" fill="${DONKER}"/>
    <line x1="60" y1="80" x2="${gx}" y2="${gy}" stroke="${kleur}" stroke-width="12" stroke-linecap="round"/>
    <rect x="${gx - 9}" y="${gy - 9}" width="18" height="18" rx="3" fill="${DONKER}"/>`;
}
// Grote gripper met blokje; links en rechts = x-positie van de bekken
function bek(links, rechts) {
  return `<rect x="100" y="104" width="40" height="34" rx="3" fill="#d9a441"/>
    <rect x="${links - 6}" y="64" width="${rechts - links + 16}" height="12" rx="3" fill="${DONKER}"/>
    <rect x="${links}" y="76" width="6" height="62" fill="${DONKER}"/>
    <rect x="${rechts - 2}" y="76" width="6" height="62" fill="${DONKER}"/>
    <rect x="114" y="44" width="12" height="20" fill="${ARM}"/>`;
}
const spook = (x, y) => `<g opacity=".25">${gripper(x, y)}</g>`;

const TEKENINGEN = {
  startpositie: () => svg(armZij(), "zijaanzicht"),
  omhoog:   () => svg(armZij(150, 70) + spook(150, 30) + pijl(185, 104, 185, 48), "zijaanzicht"),
  omlaag:   () => svg(armZij(150, 62) + spook(150, 106) + pijl(185, 66, 185, 124), "zijaanzicht"),
  naar_voren:    () => svg(armZij(130, 70) + spook(190, 70) + pijl(150, 108, 205, 108), "zijaanzicht"),
  naar_achteren: () => svg(armZij(170, 70) + spook(110, 70) + pijl(150, 108, 95, 108), "zijaanzicht"),
  naar_links:  () => svg(armBoven(160, 92) + `<g opacity=".25"><rect x="151" y="31" width="18" height="18" rx="3" fill="${DONKER}"/></g>` + pijl(185, 92, 185, 44) + tekst(205, 72, "links"), "bovenaanzicht"),
  naar_rechts: () => svg(armBoven(160, 68) + `<g opacity=".25"><rect x="151" y="111" width="18" height="18" rx="3" fill="${DONKER}"/></g>` + pijl(185, 68, 185, 118) + tekst(205, 98, "rechts"), "bovenaanzicht"),
  draai_arm: () => svg(armBoven(160, 80) + `<g opacity=".25"><line x1="60" y1="80" x2="131" y2="11" stroke="${ARM}" stroke-width="12" stroke-linecap="round"/></g>
      <path d="M172,72 A112,112 0 0 0 140,22" fill="none" stroke="${PIJL}" stroke-width="4" stroke-linecap="round" marker-end="url(#pk)"/>` + tekst(192, 40, "draai"), "bovenaanzicht"),
  draai_gripper: () => svg(`<rect x="95" y="55" width="50" height="50" rx="6" fill="${DONKER}"/>
      <rect x="100" y="76" width="40" height="8" fill="#fff" opacity=".6"/>
      <path d="M160,55 A45,45 0 1 0 160,105" fill="none" stroke="${PIJL}" stroke-width="4" stroke-linecap="round" marker-end="url(#pk)"/>`
      + tekst(120, 140, "gripper draait om eigen as", DONKER, 12), ""),
  punt: () => svg(`<line x1="40" y1="120" x2="200" y2="120" stroke="${GRIJS}" stroke-width="2" marker-end="url(#pk)"/>
      <line x1="40" y1="120" x2="40" y2="20" stroke="${GRIJS}" stroke-width="2" marker-end="url(#pk)"/>
      <line x1="40" y1="120" x2="95" y2="150" stroke="${GRIJS}" stroke-width="2" marker-end="url(#pk)"/>
      ${tekst(205, 116, "x", DONKER)}${tekst(40, 14, "z", DONKER)}${tekst(104, 154, "y", DONKER)}
      <line x1="150" y1="60" x2="150" y2="120" stroke="${PIJL}" stroke-dasharray="4 4" stroke-width="2"/>
      <line x1="40" y1="60" x2="150" y2="60" stroke="${PIJL}" stroke-dasharray="4 4" stroke-width="2"/>
      <circle cx="150" cy="60" r="8" fill="${PIJL}"/>${tekst(150, 44, "doel")}
      <rect x="22" y="112" width="36" height="16" rx="3" fill="${DONKER}"/>`, "zoals Move → View"),
  gripper_dicht: () => svg(bek(94, 142) + pijl(62, 112, 84, 112) + pijl(178, 112, 156, 112) + tekst(120, 34, "pakken", DONKER), ""),
  gripper_open:  () => svg(bek(70, 166) + pijl(84, 92, 60, 92) + pijl(156, 92, 180, 92) + tekst(120, 34, "loslaten", DONKER), ""),
  wacht: () => svg(`<circle cx="120" cy="80" r="50" fill="#fff" stroke="${DONKER}" stroke-width="5"/>
      <line x1="120" y1="80" x2="120" y2="45" stroke="${DONKER}" stroke-width="5" stroke-linecap="round"/>
      <line x1="120" y1="80" x2="145" y2="92" stroke="${PIJL}" stroke-width="5" stroke-linecap="round"/>`, ""),
  bericht: () => svg(`<path d="M50,30 h140 a12,12 0 0 1 12,12 v56 a12,12 0 0 1 -12,12 h-90 l-24,22 v-22 h-26 a12,12 0 0 1 -12,-12 v-56 a12,12 0 0 1 12,-12z" fill="#fff" stroke="${DONKER}" stroke-width="4"/>`
      + tekst(120, 76, "Hallo!", DONKER, 20), "logboek van de robot"),
  herhaal: () => svg(`<path d="M80,50 A45,45 0 1 1 72,105" fill="none" stroke="#5ba55b" stroke-width="8" stroke-linecap="round"/>
      <path d="M62,96 L72,112 L86,98" fill="none" stroke="#5ba55b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`
      + tekst(118, 88, "× 3", DONKER, 24), ""),
  geen: () => svg(tekst(120, 85, "Klik op een blok", GRIJS, 15), "")
};

// Uitleg per blok (titel, tekst, welke tekening)
function uitlegVoor(b) {
  if (!b) return { titel: "Klik op een blok", tekst: "Klik op een blok in het werkblad om te zien wat het doet.", plaat: "geen" };
  const tov = b.getFieldValue && b.getFieldValue("TOV");
  const tovTekst = tov === "voet"
    ? " De richting is <b>vast in de ruimte</b> (t.o.v. de robotvoet): omhoog is altijd naar het plafond."
    : " De richting is <b>t.o.v. de gripper</b>: draait de gripper, dan draait de richting mee. 'Omlaag' is de kant waar de gripper naartoe wijst.";
  switch (b.type) {
    case "robot_start": return { titel: "Ga naar startpositie", plaat: "startpositie",
      tekst: "De arm gaat rechtop staan met de gripper naar beneden. Begin hier elk programma mee: zo weet je zeker waar de arm is." };
    case "robot_richting": {
      const r = b.getFieldValue("RICHTING");
      const namen = { omhoog: "omhoog", omlaag: "omlaag", naar_links: "naar links", naar_rechts: "naar rechts",
                      naar_voren: "naar voren", naar_achteren: "naar achteren" };
      return { titel: `Beweeg ${namen[r]}`, plaat: r,
        tekst: `De gripper schuift in een rechte lijn ${namen[r]}, zoveel millimeter als je invult. 100 mm = 10 cm.` + tovTekst };
    }
    case "robot_draai": return { titel: "Draai de arm", plaat: "draai_arm",
      tekst: "De hele arm draait om de voet, zoals een draaimolen. Positief getal = linksom, negatief = rechtsom. 90 graden is een kwartslag." };
    case "robot_draai_gripper": return { titel: "Draai de gripper", plaat: "draai_gripper",
      tekst: "Alleen de gripper draait om zijn eigen as, de rest van de arm blijft staan. Handig om een blokje recht te zetten." };
    case "robot_punt": return { titel: "Ga naar punt", plaat: "punt",
      tekst: "De gripper gaat in een rechte lijn naar een vaste plek. x, y en z zijn de afstanden in mm vanaf de robotvoet, dezelfde getallen als in het robotscherm bij Move → Feature: View. z is de hoogte." };
    case "robot_grijper": return b.getFieldValue("STAND") === "True"
      ? { titel: "Gripper dicht", plaat: "gripper_dicht", tekst: "De bekken van de gripper gaan naar elkaar toe: de robot pakt iets vast." }
      : { titel: "Gripper open", plaat: "gripper_open", tekst: "De bekken gaan uit elkaar: de robot laat los." };
    case "robot_wacht": return { titel: "Wacht", plaat: "wacht",
      tekst: "De robot staat even stil. Handig na het pakken, zodat de gripper echt dicht is voordat de arm beweegt." };
    case "robot_bericht": return { titel: "Toon bericht", plaat: "bericht",
      tekst: "Zet een tekst in het logboek van de robot (tabblad Log in het robotscherm). Zo zie je waar je programma is." };
    case "controls_repeat_ext": return { titel: "Herhaal", plaat: "herhaal",
      tekst: "Alles wat binnen dit blok staat, wordt een aantal keer achter elkaar uitgevoerd. Zo hoef je niet alles opnieuw te slepen." };
    case "controls_for": return { titel: "Tel van ... tot ...", plaat: "herhaal",
      tekst: "Herhaalt de blokken en houdt bij hoe vaak (in een variabele). Gebruik die variabele bijvoorbeeld om elke keer hoger te stapelen." };
    default: return { titel: "Hulpblok", plaat: "geen",
      tekst: "Dit is een reken-, vergelijk- of variabelenblok. Gebruik het om getallen in andere blokken te berekenen." };
  }
}

function toonUitleg(b) {
  const u = uitlegVoor(b);
  document.getElementById("uitleg").innerHTML =
    `<div class="plaat">${TEKENINGEN[u.plaat]()}</div><h3>${u.titel}</h3><p>${u.tekst}</p>`;
}

// Kleine icoontjes in de blokken zelf
const icoon = s => "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${s}</svg>`);
const ICONEN = {
  start: icoon(`<path d="M5 20h14M8 20v-4M8 16V5h9v5"/><path d="M14 10h6"/>`),
  beweeg: icoon(`<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>`),
  draai: icoon(`<path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/>`),
  punt: icoon(`<circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/>`),
  gripper: icoon(`<path d="M6 4h12M8 4v8l-2 8M16 4v8l2 8"/>`),
  wacht: icoon(`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`),
  bericht: icoon(`<path d="M4 5h16v11H9l-5 4z"/>`)
};
const img = (src) => ({ type: "field_image", src, width: 18, height: 18, alt: "" });

// =====================================================================
// BLOKKEN
// =====================================================================
const KLEUR_BEWEGING = 210, KLEUR_GRIJPER = 20, KLEUR_ROBOT = 0, KLEUR_TIJD = 290;
const TOV = { type: "field_dropdown", name: "TOV", options: [["t.o.v. gripper", "gripper"], ["t.o.v. robotvoet", "voet"]] };

Blockly.defineBlocksWithJsonArray([
  { type: "robot_start", message0: "%1 ga naar startpositie", args0: [img(ICONEN.start)],
    previousStatement: null, nextStatement: null, colour: KLEUR_BEWEGING },
  { type: "robot_richting", message0: "%1 beweeg %2 %3 mm %4",
    args0: [img(ICONEN.beweeg),
      { type: "field_dropdown", name: "RICHTING", options: [
        ["omhoog", "omhoog"], ["omlaag", "omlaag"], ["naar links", "naar_links"],
        ["naar rechts", "naar_rechts"], ["naar voren", "naar_voren"], ["naar achteren", "naar_achteren"]]},
      { type: "input_value", name: "MM", check: "Number" }, TOV],
    inputsInline: true, previousStatement: null, nextStatement: null, colour: KLEUR_BEWEGING },
  { type: "robot_draai", message0: "%1 draai de arm %2 graden",

let regels = [];   // [{tekst, id}]
function maakRegels() {
  const ruw = gen.workspaceToCode(werkblad).split("\n");
  const uit = [{ tekst: "from robot import Robot" }, { tekst: "" }, { tekst: "r = Robot()" }, { tekst: "" }];
  let id = null;
  for (const r of ruw) {
    const m = r.match(/^\s*#BLOK '(.*)'$/);
    if (m) { id = m[1]; continue; }
    if (/^\w+ = None$/.test(r)) continue;          // Blockly zet variabelen eerst op None
    if (r.trim() === "" && uit.length === 4) continue; // geen lege regels bovenaan
    uit.push({ tekst: r, id: id }); id = null;
  }
  while (uit.length && uit[uit.length - 1].tekst === "") uit.pop();
  uit.push({ tekst: "" }, { tekst: "r.start()" });
  return uit;
}
const maakCode = () => maakRegels().map(r => r.tekst).join("\n") + "\n";
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  markeer();
}
function statementBlok(b) {
  while (b && !b.previousConnection && b.getParent()) b = b.getParent();
  return b;
}
let gekozenId = null;
function geselecteerd() {
  const s = gekozenId ? werkblad.getBlockById(gekozenId) : null;

}

  document.querySelectorAll("#python .regel").forEach(el => {
    const aan = !!b && el.dataset.id === b.id;

// CODE -> BLOKKEN (alleen de robotopdrachten, herhaal en variabelen)
// =====================================================================
function zetOm(code) {
  const variabelen = {};
  const varId = naam => (variabelen[naam] = variabelen[naam] || ("var_" + naam));
  const NUM = /^-?\d+(\.\d+)?$/, NAAM = /^[A-Za-z_]\w*$/;
  const OPS = { "+": "ADD", "-": "MINUS", "*": "MULTIPLY", "/": "DIVIDE" };

  function waarde(s) {
    s = s.trim();
    if (NUM.test(s)) return { shadow: { type: "math_number", fields: { NUM: Number(s) } } };
    const leeg = { shadow: { type: "math_number", fields: { NUM: 0 } } };
    if (NAAM.test(s)) return { ...leeg, block: { type: "variables_get", fields: { VAR: { id: varId(s) } } } };
    const m = s.match(/^(.+?)\s*([+\-*/])\s*(.+)$/);
    if (m && (NUM.test(m[1].trim()) || NAAM.test(m[1].trim())) && (NUM.test(m[3].trim()) || NAAM.test(m[3].trim())))
      return { ...leeg, block: { type: "math_arithmetic", fields: { OP: OPS[m[2]] },
        inputs: { A: waarde(m[1]), B: waarde(m[3]) } } };
    throw new Error(`"${s}" kan ik niet als getal of variabele lezen`);
  }
  const args = s => s.trim() === "" ? [] : s.split(",").map(a => a.replace(/^\s*\w+\s*=(?!=)/, "").trim());

  function opdracht(t) {
    let m;
    if (/^r\.startpositie\(\)$/.test(t)) return { type: "robot_start" };
    if ((m = t.match(/^r\.(omhoog|omlaag|naar_links|naar_rechts|naar_voren|naar_achteren)\((.*)\)$/))) {
      const a = args(m[2]); const tov = (a[1] || '"gripper"').replace(/["']/g, "");
      if (!["gripper", "voet"].includes(tov)) throw new Error(`kies "gripper" of "voet", niet "${tov}"`);
      return { type: "robot_richting", fields: { RICHTING: m[1], TOV: tov }, inputs: { MM: waarde(a[0]) } };
    }
    if ((m = t.match(/^r\.draai_basis\((.*)\)$/)))   return { type: "robot_draai", inputs: { GRADEN: waarde(m[1]) } };
    if ((m = t.match(/^r\.draai_gripper\((.*)\)$/))) return { type: "robot_draai_gripper", inputs: { GRADEN: waarde(m[1]) } };
    if ((m = t.match(/^r\.beweeg_lineair\((.*)\)$/))) {
      const a = args(m[1]); if (a.length < 3) throw new Error("ga naar punt heeft x, y en z nodig");
      return { type: "robot_punt", inputs: { X: waarde(a[0]), Y: waarde(a[1]), Z: waarde(a[2]) } };
    }
    if ((m = t.match(/^r\.grijper\((True|False)\)$/))) return { type: "robot_grijper", fields: { STAND: m[1] } };
    if ((m = t.match(/^r\.wacht\((.*)\)$/)))           return { type: "robot_wacht", inputs: { SEC: waarde(m[1]) } };
    if ((m = t.match(/^r\.bericht\((["'])(.*)\1\)$/))) return { type: "robot_bericht", fields: { TEKST: m[2] } };
    if ((m = t.match(/^(\w+)\s*\+=\s*(.+)$/)))
      return { type: "math_change", fields: { VAR: { id: varId(m[1]) } }, inputs: { DELTA: waarde(m[2]) } };
    if ((m = t.match(/^(\w+)\s*=\s*(.+)$/)) && m[1] !== "r")
      return { type: "variables_set", fields: { VAR: { id: varId(m[1]) } }, inputs: { VALUE: waarde(m[2]) } };
    return null;
  }

  // Regels met inspringing verzamelen
  const lijst = [];
  code.replace(/\t/g, "    ").split("\n").forEach((r, i) => {
    const t = r.trim();
    if (!t || t.startsWith("#")) return;
    if (/^(import |from |sys\.|r\s*=\s*Robot\(|r\.start\(\)|r\.zet_aan\(\))/.test(t)) return;
    lijst.push({ nr: i + 1, inspring: r.match(/^ */)[0].length, t });
  });

  let p = 0;
  function blok(niveau) {
    let eerste = null, laatste = null;
    while (p < lijst.length && lijst[p].inspring >= niveau) {
      const { nr, inspring, t } = lijst[p];
      if (inspring > niveau) throw new Error(`regel ${nr}: inspringing klopt niet`);
      p++;
      let b, m;
      try {
        if ((m = t.match(/^for\s+(\w+)\s+in\s+range\(\s*(?:int\(\s*([^,()]+?)\s*\)|([^,]+?))\s*\)\s*:$/))) {
          b = { type: "controls_repeat_ext", inputs: { TIMES: waarde(m[2] || m[3]) } };
        } else if ((m = t.match(/^for\s+(\w+)\s+in\s+range\(\s*([^,]+?)\s*,\s*([^,]+?)\s*\)\s*:$/))) {
          const tot = NUM.test(m[3]) ? String(Number(m[3]) - 1) : `${m[3]} - 1`;
          b = { type: "controls_for", fields: { VAR: { id: varId(m[1]) } },
                inputs: { FROM: waarde(m[2]), TO: waarde(tot), BY: waarde("1") } };
        } else {
          b = opdracht(t);
          if (!b) throw new Error(`deze code ken ik niet als blok: ${t}`);
        }
      } catch (e) { throw new Error(e.message.startsWith("regel") ? e.message : `regel ${nr}: ${e.message}`); }
      if (b.type === "controls_repeat_ext" || b.type === "controls_for") {
        const binnen = p < lijst.length && lijst[p].inspring > inspring ? blok(lijst[p].inspring) : null;
        if (!binnen) throw new Error(`regel ${nr}: na 'for' moeten ingesprongen regels komen`);
        b.inputs.DO = { block: binnen };
      }
      if (!eerste) eerste = b; else laatste.next = { block: b };
      laatste = b;
    }
    return eerste;
  }
  const start = lijst.length ? blok(lijst[0].inspring) : null;
  if (p < lijst.length) throw new Error(`regel ${lijst[p].nr}: inspringing klopt niet`);
  if (start) { start.x = 40; start.y = 40; }
  return { blocks: { languageVersion: 0, blocks: start ? [start] : [] },
           variables: Object.entries(variabelen).map(([name, id]) => ({ name, id })) };
}

function laadCode(code) {
  const data = zetOm(code);           // gooit een fout als het niet lukt
  werkblad.clear();
  Blockly.serialization.workspaces.load(data, werkblad);
  toonCode();
}

    uitvoer.className = d.ok ? "ok" : "fout";

  } catch (e) {

    uitvoer.textContent = "Geen verbinding met de blokkenserver. Ververs de pagina.";
